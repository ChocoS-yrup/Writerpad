name: Validate Sync Contract

on:
  pull_request:
    paths:
      - "sync-contract/**"
      - ".github/workflows/sync-contract.yml"
  push:
    branches:
      - main
    paths:
      - "sync-contract/**"
      - ".github/workflows/sync-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync-contract/requirements-validation.txt
      - name: Install pinned validator dependencies
        run: python -m pip install -r sync-contract/requirements-validation.txt
      - name: Validate schemas, vectors, and canonical digest
        run: python sync-contract/scripts/verify_contract.py
