name: Run Server Sync Contract Validation

on:
  workflow_call:
    inputs:
      checkout_sha:
        description: Exact commit SHA to validate
        required: true
        type: string
      validation_label:
        description: Human-readable validation target
        required: true
        type: string

permissions:
  contents: read

jobs:
  authenticated-handshake:
    name: Authenticated sync handshake (${{ inputs.validation_label }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writerpad_handshake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d writerpad_handshake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EXPECTED_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: writerpad_handshake
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Check out requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_CHECKOUT_SHA }}
          persist-credentials: false
          fetch-depth: 2
      - name: Confirm exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_CHECKOUT_SHA"
      - name: Apply handshake server chain and safe re-run
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_postgres.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811000000_operational_v2_schema_baseline_snapshot.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811010000_sync_contract_0_1_0_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811020000_sync_contract_0_1_0_rpcs.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260813063251_sync_contract_0_3_0_storage_name_v2.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260814182850_rpc_auth_error_envelope_corrective.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260820113209_authenticated_sync_handshake.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260820113209_authenticated_sync_handshake.sql
      - name: Run authenticated sync handshake conformance
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/authenticated_sync_handshake.sql

  postgres-contract:
    name: PostgreSQL migration and RPC conformance (${{ inputs.validation_label }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writerpad_stage7
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d writerpad_stage7"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EXPECTED_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: writerpad_stage7
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Check out requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_CHECKOUT_SHA }}
          persist-credentials: false
          fetch-depth: 2
      - name: Confirm exact checkout SHA
        run: >-
          python -c "import os, subprocess;
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip();
          expected = os.environ['EXPECTED_CHECKOUT_SHA'];
          print(f'Expected HEAD: {expected}'); print(f'Actual HEAD:   {actual}');
          raise SystemExit(0 if actual == expected else 1)"
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: sync-contract/requirements-validation.txt
      - name: Install pinned contract verifier
        run: python -m pip install -r sync-contract/requirements-validation.txt
      - name: Verify released contract and server pins
        run: |
          python sync-contract/scripts/verify_contract.py
          python supabase/tests/verify_stage7_server.py
          python supabase/tests/verify_stage7_revalidation_harness.py
      - name: Apply operational v2 snapshot to a blank PostgreSQL 17.6 database
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_postgres.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811000000_operational_v2_schema_baseline_snapshot.sql
          actual_catalog="$(psql -Atq -v ON_ERROR_STOP=1 -f supabase/tests/operational_v2_catalog_manifest.sql)"
          expected_catalog="on|6c71ff36a90993dc327557b4a1a64c0dfb27b347134ed89e7f126dae76c6ff9a|49540"
          echo "actual_catalog=$actual_catalog"
          echo "expected_catalog=$expected_catalog"
          if [ "$actual_catalog" != "$expected_catalog" ]; then
            psql -v ON_ERROR_STOP=1 -f supabase/tests/operational_v2_catalog_diagnostics.sql
          fi
          test "$actual_catalog" = "$expected_catalog"
      - name: Verify snapshot guard and failed-apply rollback
        shell: bash
        run: |
          if psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811000000_operational_v2_schema_baseline_snapshot.sql > /tmp/snapshot-rerun.log 2>&1; then
            echo "snapshot unexpectedly re-applied over an existing app schema"
            exit 1
          fi
          grep -q "BASELINE_SNAPSHOT_REQUIRES_EMPTY_APP_SCHEMA" /tmp/snapshot-rerun.log
          actual_catalog="$(psql -Atq -v ON_ERROR_STOP=1 -f supabase/tests/operational_v2_catalog_manifest.sql)"
          echo "catalog_after_guard=$actual_catalog"
          test "$actual_catalog" = "on|6c71ff36a90993dc327557b4a1a64c0dfb27b347134ed89e7f126dae76c6ff9a|49540"

          createdb writerpad_snapshot_failure
          if PGDATABASE=writerpad_snapshot_failure psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811000000_operational_v2_schema_baseline_snapshot.sql > /tmp/snapshot-failure.log 2>&1; then
            echo "snapshot unexpectedly succeeded without Supabase auth prerequisites"
            exit 1
          fi
          test "$(PGDATABASE=writerpad_snapshot_failure psql -Atq -c "select to_regclass('public.projects') is null and to_regnamespace('private') is null")" = "t"
      - name: Apply and safely re-run server migrations
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811010000_sync_contract_0_1_0_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811020000_sync_contract_0_1_0_rpcs.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260813063251_sync_contract_0_3_0_storage_name_v2.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260814182850_rpc_auth_error_envelope_corrective.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260820113209_authenticated_sync_handshake.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811010000_sync_contract_0_1_0_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260811020000_sync_contract_0_1_0_rpcs.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260813063251_sync_contract_0_3_0_storage_name_v2.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260814182850_rpc_auth_error_envelope_corrective.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260820113209_authenticated_sync_handshake.sql
      - name: Run atomic, replay, cancellation, and migration checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stage7_server_contract.sql
      - name: Run storage-name-v2 server conformance
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/storage_name_v2_server_contract.sql
      - name: Run RPC auth error-envelope conformance
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rpc_auth_error_envelope.sql
      - name: Run authenticated sync handshake conformance
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/authenticated_sync_handshake.sql
      - name: Prepare local-only Stage 7 revalidation identities and allowlist
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id) values
            ('92000000-0000-4000-8000-000000000701'),
            ('92000000-0000-4000-8000-000000000702')
          on conflict (id) do nothing;

          select set_config(
            'request.jwt.claim.sub',
            '92000000-0000-4000-8000-000000000701',
            false
          );
          select public.ensure_project(
            '02000000-0000-4000-8000-000000000703',
            'Existing fixture fingerprint guard'
          );

          update private.sync_contract_allowlist set enabled = false;
          update private.sync_contract_allowlist
          set enabled = true
          where contract_version = '0.3.0'
            and canonical_contract_sha256 =
              'abbd234c7b65d422c2e43d468f4f724e069ede26a3d24be22eb8b35cce8ebf2c'
            and contract_git_commit =
              '2705fcbda0be440a9d82a5e1919f2885c6166727'
            and revoked_at is null;

          do $assert$
          begin
            if (select count(*) from private.sync_contract_allowlist where enabled) <> 1
               or not exists (
                 select 1
                 from private.sync_contract_allowlist
                 where contract_version = '0.3.0'
                   and canonical_contract_sha256 =
                     'abbd234c7b65d422c2e43d468f4f724e069ede26a3d24be22eb8b35cce8ebf2c'
                   and contract_git_commit =
                     '2705fcbda0be440a9d82a5e1919f2885c6166727'
                   and enabled
                   and revoked_at is null
               ) then
              raise exception 'LOCAL_HARNESS_ALLOWLIST_PREP_FAILED';
            end if;
          end
          $assert$;
          SQL
      - name: Verify authenticated harness transaction rollback
        shell: bash
        run: |
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config(
            'request.jwt.claim.sub',
            '92000000-0000-4000-8000-000000000701',
            true
          );
          set local role authenticated;
          select public.ensure_project(
            '02000000-0000-4000-8000-000000000706',
            'Harness rollback probe'
          );
          select 1 / 0;
          commit;
          SQL
          then
            echo "rollback probe unexpectedly committed"
            exit 1
          fi

          probe_counts="$(psql -Atq -v ON_ERROR_STOP=1 -c "
            select
              (select count(*) from public.projects
               where project_id = '02000000-0000-4000-8000-000000000706'),
              (select count(*) from public.project_members
               where project_id = '02000000-0000-4000-8000-000000000706')
          ")"
          echo "rollback_probe_counts=$probe_counts"
          test "$probe_counts" = "0|0"
      - name: Run exact Stage 7 staging revalidation harness locally
        run: >-
          psql
          -v ON_ERROR_STOP=1
          -v test_run_id=02000000-0000-4000-8000-000000000705
          -v server_project_id=02000000-0000-4000-8000-000000000704
          -v client_build_id=ci-stage7-revalidation-harness
          -v owner_user_id=92000000-0000-4000-8000-000000000701
          -v unauthorized_user_id=92000000-0000-4000-8000-000000000702
          -v existing_fixture_project_id=02000000-0000-4000-8000-000000000703
          -v expected_existing_fixture_fingerprint=capture
          -f supabase/tests/stage7_staging_revalidation_harness.sql
      - name: Check patch whitespace
        run: git diff --check "${EXPECTED_CHECKOUT_SHA}^1" "${EXPECTED_CHECKOUT_SHA}"
