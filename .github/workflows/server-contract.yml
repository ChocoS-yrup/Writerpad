name: Validate Server Sync Contract

on:
  pull_request:
    paths:
      - "sync-contract/**"
      - "supabase/**"
      - ".gitattributes"
      - ".github/workflows/server-contract.yml"
      - ".github/workflows/server-contract-run.yml"
  push:
    branches:
      - main
    paths:
      - "sync-contract/**"
      - "supabase/**"
      - ".gitattributes"
      - ".github/workflows/server-contract.yml"
      - ".github/workflows/server-contract-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-head:
    name: Validate exact head
    uses: ./.github/workflows/server-contract-run.yml
    with:
      checkout_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      validation_label: exact head

  validate-pr-merge:
    name: Validate PR merge result
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/server-contract-run.yml
    with:
      checkout_sha: ${{ github.sha }}
      validation_label: PR merge result
